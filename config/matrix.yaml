    - гибрид pm
    - hybrid pm
  - id: role_enterprise
    name: Enterprise-масштаб
    weight: 9
    description: Вакансия предполагает работу с крупными заказчиками, сложными интеграциями
      и масштабными системами — ключевое для Enterprise PM
    keywords:
    - enterprise
    - крупный
    - масштаб
    - сложная интеграция
    - системная интеграция
