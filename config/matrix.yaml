groups:
- id: role
  name: Роль и содержание работы
  weight: 9
  description: Насколько задачи и обязанности в вакансии совпадают с классическим
    project или product management — базовая проверка перед детальным скорингом
  criteria:
  - id: role_pm_po
    name: PM/PO (гибрид)
    weight: 9
    description: Наличие в вакансии project manager или product owner — базовый пропуск
      в скоринг, проверяет совпадение по названию и описанию роли
    keywords:
    - project manager
    - product owner
    - pm/po
    - it project manager
