{% extends "base.html" %}
{% block title %}Дашборд{% endblock %}

{% block content %}
<h1>Дашборд</h1>

<div class="stats-grid">
  <div class="card">
    <h3>Всего вакансий</h3>
    <div class="stat-number" id="stat-total">—</div>
  </div>
  <div class="card">
    <h3>По статусам</h3>
    <pre class="stat-pre" id="stat-status">—</pre>
  </div>
  <div class="card">
    <h3>По категориям</h3>
    <pre class="stat-pre" id="stat-category">—</pre>
  </div>
</div>

<div style="display:flex;gap:8px;margin-top:16px;align-items:center;">
  <button onclick="runScan()" class="btn">Запустить сканирование</button>
  <span id="scan-result" style="font-size: 14px;"></span>
</div>
{% endblock %}
