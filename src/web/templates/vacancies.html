{% extends "base.html" %}
{% block title %}Вакансии{% endblock %}

{% block content %}
<h1>Вакансии</h1>

<div style="margin-bottom: 16px;display:flex;gap:12px;align-items:center;">
  <label>Фильтр по категории: </label>
  <select id="category-filter" onchange="filterVacancies()" class="input" style="width: auto;">
    <option value="">Все</option>
    <option value="S">S (идеал)</option>
    <option value="A">A (сильное)</option>
    <option value="B">B (можно)</option>
    <option value="C">C (слабое)</option>
    <option value="REJECT">REJECT</option>
  </select>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Вакансия</th>
      <th>Компания</th>
      <th>Score</th>
      <th>Категория</th>
      <th>Статус</th>
      <th>Дата</th>
    </tr>
  </thead>
  <tbody id="vacancies-body">
    <tr><td colspan="6" style="text-align:center;color:#999;">Загрузка...</td></tr>
  </tbody>
</table>
{% endblock %}
