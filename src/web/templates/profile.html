{% extends "base.html" %}
{% block title %}Профиль{% endblock %}

{% block content %}
<h1>Профиль пользователя</h1>

<div class="card">
  <h3>Основное</h3>
  <div class="form-group">
    <label>Имя</label>
    <input id="field-name" type="text" class="input" />
  </div>
  <div class="form-group">
    <label>Локация</label>
    <input id="field-location" type="text" class="input" />
  </div>
  <div class="form-group">
    <label>Формат работы</label>
    <select id="field-work_format" class="input">
      <option value="remote">Удалёнка</option>
      <option value="hybrid">Гибрид</option>
      <option value="office">Офис</option>
    </select>
  </div>
  <div class="form-group">
    <label>Ожидаемая ЗП (net, ₽)</label>
    <input id="field-salary" type="number" class="input" />
  </div>
  <button onclick="saveProfile()" class="btn">Сохранить</button>
  <span id="profile-status" style="margin-left: 12px;"></span>
</div>

<div class="card" style="margin-top: 16px;">
  <h3>Фильтры поиска</h3>
  <p style="color: #666; margin-bottom: 12px;">Регионы (через запятую), должности, ключевые слова.</p>
  <div class="form-group">
    <label>Регионы</label>
    <input id="field-regions" type="text" class="input" placeholder="Санкт-Петербург, Москва" />
  </div>
  <div class="form-group">
    <label>Должности</label>
    <input id="field-titles" type="text" class="input" placeholder="PM, Product Manager, PO" />
  </div>
  <div class="form-group">
    <label>Ключевые слова</label>
    <input id="field-keywords" type="text" class="input" placeholder="Enterprise, Senior, Head of Delivery" />
  </div>
  <button onclick="saveFilters()" class="btn">Сохранить фильтры</button>
  <span id="filters-status" style="margin-left: 12px;"></span>
</div>

<div class="card" style="margin-top: 16px;">
  <h3>Интеграции</h3>
  <div class="form-group">
    <label>HH API Access Token</label>
    <input id="field-hh_token" type="password" class="input" placeholder="Вставь HH токен сюда" />
    <span style="font-size: 12px; color: #999;">Как получить: dev.hh.ru → зарегистрировать приложение → OAuth токен</span>
  </div>
  <div class="form-group">
    <label>HH Resume ID</label>
    <input id="field-hh_resume_id" type="text" class="input" placeholder="ID резюме на HH" />
  </div>
  <div class="form-group">
    <label>Telegram Chat ID</label>
    <input id="field-telegram_chat_id" type="text" class="input" placeholder="ID чата для уведомлений" />
  </div>
  <button onclick="saveIntegrations()" class="btn">Сохранить</button>
  <span id="integrations-status" style="margin-left: 12px;"></span>
</div>
{% endblock %}
